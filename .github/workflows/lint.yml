# Check source.
name: lint
on:
  pull_request:
  push:
permissions: read-all
env:
  CARGO_TERM_COLOR: always
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check format of Python code
      uses: psf/black@stable
      with:
        options: "--check"
        src: "keramics-python"
  cargo_fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check format of Rust code
      run: |
        cargo fmt --check
  rumdl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install rumdl
      run: cargo install --locked rumdl
    - name: Check format of Markdown documents
      run: |
        rumdl check
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
    - name: Check format of bash scripts
      run: |
        find scripts -name "*.sh" -exec shellcheck {} +
