# Generate code coverage report and upload to Codecov.
name: coverage
on: [push, pull_request]
permissions: read-all
env:
  CARGO_TERM_COLOR: always
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Python dependencies
      run: |
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y python3 python3-dev python3-venv python3-maturin python3-pip tox
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate code coverage report
      run: |
        cargo llvm-cov --all-features --workspace --lcov --output-path coverage.lcov
        cd keramics-python && tox -ecoverage
    - name: Upload code coverage report to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.lcov,keramics-python/coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
