[files]
extend-exclude = [
    "test_data/"
]

[default]
binary = false
check-filename = true
check-file = true
unicode = true
locale = "en-us"
extend-ignore-re = [
    # Ignore a line that is preceded with `// typos:ignore`
    "(#|//)\\s*typos:ignore\\n.*",

    # Ignore code blocks between `// typos:disable` and `// typos:enable`
    "(?s)(#|//)\\s*typos:disable.*?\\n\\s*(#|//)\\s*typos:enable",

    # Ignore text between <!-- typos:disable --> and <!-- typos:enable -->
    "(?s)<!--\\s*typos:disable\\s*-->.*?<!--\\s*typos:enable\\s*-->",

    # Ignore "CHECKSUMED"
    "\\bCHECKSUMED\\b",

    # Ignore "DT_WHT"
    "\\bDT_WHT\\b",

    # Ignore "kMDItemWhereFroms"
    "\\bkMDItemWhereFroms\\b",

    # Ignore "mke2fs"
    "\\bmke2fs\\b",

    # Ignore "U+####"
    "\\bU\\+[0-9a-f]{4}\\b"
]
extend-words = {
    "conectix" = "conectix",
    "EDE" = "EDE",
    "GOST" = "GOST",
    "INDX" = "INDX",
}
